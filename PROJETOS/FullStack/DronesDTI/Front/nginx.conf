server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota (/pedidos, /dashboard...) devolve o index.html
    # e o React Router decide o que mostrar. É o mesmo papel do vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos com hash no nome podem ficar em cache por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
