spring.application.name=DronesDTI

# ==========================================================================
# SERVIDOR
# O Render injeta a variável PORT; no seu computador vale 8080.
# ==========================================================================
server.port=${PORT:8080}

# ==========================================================================
# MONGODB (lido por config/MongoDBProperties.java)
#
# Formato ${VARIAVEL:valor-padrao}
#   - Existe a variável MONGODB_URI (ex.: no Render)? Ela é usada.
#   - Não existe? Vale o texto depois dos dois-pontos: o MongoDB local
#     do docker-compose (mongodb://localhost:27017).
#
# Para usar o MongoDB Atlas, defina MONGODB_URI com a connection string
# do seu cluster (veja o README, seção "MongoDB Atlas").
# ==========================================================================
app.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
app.mongodb.database=${MONGODB_DATABASE:DronesDTI}

# ==========================================================================
# CORS (lido por config/CorsProperties.java)
# Quem pode chamar esta API pelo navegador. Separe por vírgula, sem "/" no final.
# ==========================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://drones-dti.vercel.app,https://*.vercel.app,https://drones.dti.io,https://drones.dti.dev}

# ==========================================================================
# CIDADE (lido por config/CidadeProperties.java)
# A cidade é uma malha 2D em quilômetros: x de 0 a 20 e y de 0 a 20.
# A base dos drones fica no centro. 1 quadra = 100 metros.
# ==========================================================================
app.cidade.largura-km=20
app.cidade.altura-km=20
app.cidade.base-x=10
app.cidade.base-y=10
app.cidade.metros-por-quadra=100

# ==========================================================================
# SIMULAÇÃO (lido por config/SimulacaoProperties.java)
# fator-tempo=60 -> 1 segundo real = 1 minuto simulado
# ==========================================================================
app.simulacao.fator-tempo=60
app.simulacao.intervalo-ms=1000
app.simulacao.despacho-automatico=true
app.simulacao.tempo-carregamento-min=2
app.simulacao.tempo-entrega-min=1
app.simulacao.limiar-recarga=30
app.simulacao.recarga-por-minuto=5
app.simulacao.minutos-envelhecimento=30
app.simulacao.limite-exato=8
app.simulacao.max-paradas=10
app.simulacao.popular-ao-iniciar=true

# ==========================================================================
# OBSERVABILIDADE (Actuator + Prometheus)
# /actuator/health e /actuator/prometheus (usado pelo Grafana nos testes de carga)
# ==========================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
