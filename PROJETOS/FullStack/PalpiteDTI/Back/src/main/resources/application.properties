spring.application.name=PalpiteDTI

# ==========================================================================
# SERVIDOR
# O Render injeta a variável PORT; no seu computador vale 8080.
# ==========================================================================
server.port=${PORT:8080}

# ==========================================================================
# MONGODB (lido por config/MongoDBProperties.java)
#
# Formato ${VARIAVEL:valor-padrao}
#   - Existe a variável MONGODB_URI (ex.: no Render)? Ela é usada.
#   - Não existe? Vale o texto depois dos dois-pontos: o MongoDB local
#     do docker-compose (mongodb://localhost:27017).
#
# Para usar o MongoDB Atlas, defina MONGODB_URI com a connection string
# do seu cluster (veja o README, seção "MongoDB Atlas").
# ==========================================================================
app.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
app.mongodb.database=${MONGODB_DATABASE:PalpiteDTI}

# ==========================================================================
# CORS (lido por config/CorsProperties.java)
# Quem pode chamar esta API pelo navegador. Separe por vírgula, sem "/" no final.
# ==========================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://palpite-dti.vercel.app,https://*.vercel.app,https://palpite.dti.dev}

# ==========================================================================
# JOGO (lido por config/JogoProperties.java)
# O PDF pede um número inteiro de 1 a 100. Os limites ficam configuráveis
# para mostrar que nenhuma regra depende do "100" escrito no código.
# ==========================================================================
app.jogo.minimo=1
app.jogo.maximo=100
app.jogo.tamanho-ranking=10

# Cria partidas de exemplo (jogadas por um robô) se o banco estiver vazio,
# para o ranking e as estatísticas não abrirem vazios na demonstração.
app.jogo.popular-ao-iniciar=true
app.jogo.partidas-iniciais=30

# ==========================================================================
# OBSERVABILIDADE (Actuator + Prometheus)
# /actuator/health e /actuator/prometheus (usado pelo Grafana nos testes de carga)
# ==========================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
