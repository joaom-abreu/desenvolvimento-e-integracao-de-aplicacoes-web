spring.application.name=AraCoffee

# ==========================================================================
# SERVIDOR
# O front-end (React + Vite) chama esta porta: http://localhost:8080
# ==========================================================================
server.port=8080

# ==========================================================================
# MONGODB ATLAS
# Lido pela classe config/MongoDBProperties.java (prefixo "app.mongodb")
#
# Formato ${VARIAVEL:valor-padrao}
#   - Se a variável de ambiente MONGODB_URI existir (ex.: no Render), ela é usada.
#   - Se não existir (ex.: no seu computador), vale o texto depois dos dois-pontos.
#
# Troque o valor padrão pela connection string do SEU cluster:
# Atlas > Database > Connect > Drivers > Java
# Se a senha tiver caracteres especiais (@ : / ? # %), codifique-os
# (ex.: @ vira %40). Veja o README.
# ==========================================================================
app.mongodb.connection-string=${MONGODB_URI:mongodb+srv://SEU_USUARIO:SUA_SENHA@SEU_CLUSTER.xxxxxxx.mongodb.net/?retryWrites=true&w=majority}
app.mongodb.database=${MONGODB_DATABASE:aracoffee}

# ==========================================================================
# CORS (quem pode chamar esta API pelo navegador)
# Lido pela classe config/CorsProperties.java (prefixo "app.cors")
#
# - http://localhost:5173 -> front-end rodando no seu computador (npm run dev)
# - https://...vercel.app -> front-end publicado no Vercel (troque pela sua URL)
# Separe por vírgula e NÃO coloque barra (/) no final.
# ==========================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://aracoffee.vercel.app}

# ==========================================================================
# CARDÁPIO INICIAL
# Lido pela classe config/CardapioInicial.java
# true -> se a coleção "produtos" estiver vazia, grava alguns itens de exemplo
# ==========================================================================
app.cardapio.popular-ao-iniciar=true
