<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AraUrl: encurtador de URL pessoal, feito com React, Vite e Supabase." />
    <title>AraUrl - Encurtador de URL</title>

    <!-- Aplica o tema (light/dark) ANTES do React carregar, para não piscar.
         A chave "araurl:theme" é a mesma do src/config/appConfig.js -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("araurl:theme");
        } catch (e) {}
        if (tema !== "light" && tema !== "dark") {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = tema;
      })();
    </script>

    <!-- Fonte Montserrat - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
