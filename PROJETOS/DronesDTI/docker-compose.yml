# Sobe o projeto inteiro no seu computador, sem instalar Java, Node nem MongoDB:
#   docker compose up --build
# Front: http://localhost:5173 | API: http://localhost:8080 | MongoDB: localhost:27017
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-dados:/data/db

  back:
    build: ./Back
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: DronesDTI
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      - mongo

  front:
    build:
      context: ./Front
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - back

volumes:
  mongo-dados:
